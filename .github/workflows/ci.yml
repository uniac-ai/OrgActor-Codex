name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22.22.0, 24.22.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - if: matrix.node == '24.22.1'
        run: npx playwright install --with-deps chromium
      - if: matrix.node == '24.22.1'
        run: npm run test:browser
      - if: matrix.node == '24.22.1'
        run: docker build -t orgactor-codex:ci .
      - if: matrix.node == '24.22.1'
        name: Container startup
        run: |
          docker run -d --name orgactor-codex-ci -p 127.0.0.1:8877:8787 --tmpfs /data:uid=1000,gid=1000,mode=0700 orgactor-codex:ci
          trap 'docker rm -f orgactor-codex-ci' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8877/ -o /dev/null
